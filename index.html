<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lover Is a Day ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <div class="glow pink"></div><div class="glow blue"></div><div class="grain"></div>
  <div class="hearts"></div>
  <section class="card">
    <div class="shine"></div><div class="topline"></div>
    <div class="lyrics">
      <p class="near previous"></p>
      <h1 class="current"></h1>
      <p class="near next"></p>
    </div>
  </section>
  <div class="controls">
    <button id="play">▶</button>
    <div class="track"><span id="fill"></span></div>
    <span id="clock">0:00</span>
  </div>
  <audio id="audio" preload="auto" src="music.mp3"></audio>
</main>
<script src="script.js"></script>
</body>
</html>
