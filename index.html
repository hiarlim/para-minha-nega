<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lover Is a Day ♡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow pink"></div><div class="glow blue"></div><div class="grain"></div>
<header><span>lover is a day</span><b>♡</b></header>
<main>
  <section class="lyrics">
    <div id="previous" class="side"></div>
    <div id="current" class="current"></div>
    <div id="next" class="side"></div>
  </section>
  <div id="hearts"></div>
</main>
<button id="start" class="start">▶<small>tap to play</small></button>
<footer>
  <button id="play">▶</button>
  <div id="bar"><i id="fill"></i></div>
  <span id="time">0:00 / 7:36</span>
  <button id="mute">♫</button>
</footer>
<audio id="audio" preload="auto" src="music.m4a"></audio>
<script src="script.js"></script>
</body>
</html>
