<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lover Is a Day ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="glow glow-pink"></div>
    <div class="glow glow-blue"></div>
    <div class="grain"></div>
    <div class="hearts"></div>

    <section class="card">
      <div class="top-line"></div>
      <div class="lyrics">
        <p class="small previous"></p>
        <h1 class="current"></h1>
        <p class="small next"></p>
      </div>
    </section>

    <div class="controls">
      <button id="play" class="play">▶</button>
      <div class="progress"><span></span></div>
      <span class="time">0:00</span>
    </div>

    <audio id="audio" preload="auto">
      <source src="music.mp3" type="audio/mpeg">
    </audio>
  </main>
  <script src="script.js"></script>
</body>
</html>
