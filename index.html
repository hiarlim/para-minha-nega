<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="glow glow-pink"></div>
    <div class="glow glow-blue"></div>
    <div class="grain"></div>
    <div class="hearts" aria-hidden="true"></div>

    <section class="card">
      <div class="top-line"></div>
      <div class="lyrics">
        <p class="small" id="previous"></p>
        <h1 id="current">We're different</h1>
        <p class="small next" id="next"></p>
      </div>
      <button class="dot" id="nextBtn" aria-label="Próxima frase"></button>
    </section>

    <div class="progress"><span id="progressBar"></span></div>
    <button class="sound" id="soundBtn">♪</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
